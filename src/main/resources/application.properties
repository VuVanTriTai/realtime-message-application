spring.application.name=realtime-messaging-application

# ================================================================
# TOMCAT NIO — Nang tran ket noi cho 10.000 concurrent connections
# ================================================================
# Max so luong connection TCP Tomcat chap nhan (bao gom ca WebSocket).
# Mac dinh: 8192. Nang len 12000 de co buffer phia tren 10k.
server.tomcat.max-connections=12000

# Max threads xu ly HTTP request thong thuong (REST API).
# WebSocket sau khi handshake KHONG giu thread — NIO poller quan ly.
# Con so nay danh cho REST API + WebSocket handshake ban dau.
server.tomcat.threads.max=400

# So thread toi thieu luon san sang (warm thread pool).
server.tomcat.threads.min-spare=50

# Hang doi cho cac request khi tat ca threads ban — tranh tu choi ngay.
server.tomcat.accept-count=200

# Timeout ket noi nhan roi (ms). Giam xuong 60s de giai phong nhanh.
server.tomcat.connection-timeout=60000

# Táº¯t tá»± Ä‘á»™ng cháº¡y Docker Compose khi mÃ¡y khÃ´ng cÃ i Docker hoáº·c Ä‘Ã£ cháº¡y DB cá»¥c bá»™
spring.docker.compose.enabled=false

# Cáº¥u hÃ¬nh káº¿t ná»‘i PostgreSQL cá»¥c bá»™
spring.datasource.url=jdbc:postgresql://localhost:5432/realtime_message_application
spring.datasource.username=postgres
spring.datasource.password=012400zzz
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================================================
# HIKARICP — Connection Pool cho PostgreSQL
# ================================================================
# Voi 10k WebSocket connections, cac viec nang (luu DB) chay o thread pool
# rieng. Pool 20-30 la du cho most workloads (DB la bottleneck, khong phai pool).
spring.datasource.hikari.maximum-pool-size=80
spring.datasource.hikari.minimum-idle=25
# Thoi gian cho lay connection tu pool (ms). Tra loi nhanh thay vi treo.
spring.datasource.hikari.connection-timeout=5000
# Thoi gian connection nhan roi trong pool truoc khi bi dong (ms).
spring.datasource.hikari.idle-timeout=300000
# Tuoi tho toi da cua 1 connection (ms) — 30 phut.
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ChatHikariPool

# Cáº¥u hÃ¬nh Redis cá»¥c bá»™
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ================================================================
# REDIS — Lettuce Connection Pool
# ================================================================
# Lettuce (mac dinh cua Spring) dung 1 shared connection cho moi lenh.
# Voi Pub/Sub + Rate Limit + Outbox chay dong thoi, nen mo pool nho.
spring.data.redis.lettuce.pool.max-active=32
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.pool.max-wait=1000ms

# ================================================================
# OUTBOX POLLER — Hybrid Event-Driven + Backup Polling
# ================================================================
# Chu ky quet luoi an toan du phong (ms) khi khong co event moi
chat.outbox.poll-delay-ms=1000

# Timeout ket noi toi Redis (ms)
spring.data.redis.timeout=2000ms

