# ================================================================
# application-loadtest.properties
# Profile dành riêng cho Load Testing / Stress Testing
#
# Kích hoạt: thêm --spring.profiles.active=loadtest khi chạy JAR
#   java -jar target/*.jar --spring.profiles.active=loadtest
#
# Mục đích:
#   - Nới rộng Rate Limiter để không bị chặn tin nhắn test
#   - Tăng giới hạn WS rate limit lên mức không ảnh hưởng bài test
# ================================================================

# Rate Limiter WebSocket: nới từ 30 tin/10s lên 1000 tin/10s
# Để script 09 (Step Ramp, 500ms/tin = 2 tin/s) không chạm ngưỡng
chat.ratelimit.ws.msg-limit=1000
chat.ratelimit.ws.msg-window-seconds=10

# Rate Limiter HTTP (login): nới rộng để 1000 user đăng nhập trong setup()
# không bị chặn bởi IP rate limiter (mỗi X-Forwarded-For ip riêng biệt)
chat.ratelimit.http.login-limit=500
chat.ratelimit.http.login-window-seconds=60

# Log level: Tắt bớt các log không cần thiết để tiết kiệm CPU cho server
logging.level.com.project.realtime._messaging_application.common.ratelimit=WARN
logging.level.org.springframework.messaging.simp=WARN
logging.level.org.springframework.web.socket.messaging=WARN

